services:
  # 1. Express API Backend connected to MongoDB Atlas
  - type: web
    name: sportpulse-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render dashboard to your free MongoDB Atlas connection string
      - key: CLIENT_URL
        value: https://sportpulse-app.onrender.com

  # 2. React Vite Frontend
  - type: static
    name: sportpulse-app
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sportpulse-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
